name: Validate Skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm run validate
      - run: npm test
      - name: Verify npx skills discovery and install
        if: matrix.node-version == 22
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          npx -y skills add "$GITHUB_WORKSPACE" --list
          project="$(mktemp -d)"
          cd "$project"
          git init -q
          npx -y skills add "$GITHUB_WORKSPACE" \
            --skill setup-heroui-pro \
            --agent codex \
            --agent cursor \
            --agent claude-code \
            --yes
          test -f .agents/skills/setup-heroui-pro/SKILL.md
          test -f .claude/skills/setup-heroui-pro/SKILL.md

  fast-web-template:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Activate newest stable pnpm supported by this Node
        # pnpm@latest can raise its Node floor (pnpm 11 needs Node >=22.13), so
        # fall back to the newest stable major whose engines.node fits the runner.
        run: |
          version="$(node --input-type=module <<'NODE'
          import {execFileSync} from "node:child_process";
          const nodeVersion = process.versions.node;
          const npm = (...args) => execFileSync("npm", args, {encoding: "utf8"}).trim();
          const meta = JSON.parse(npm("view", "pnpm", "--json"));
          const latest = meta["dist-tags"].latest;
          if (latest.includes("-")) throw new Error(`pnpm latest is prerelease: ${latest}`);
          const cmp = (a, b) => {
            const [x, y] = [a, b].map((v) => v.split(".").map(Number));
            return x[0] - y[0] || x[1] - y[1] || x[2] - y[2];
          };
          // Newest stable release of each major, never newer than the `latest` tag, newest first.
          const candidates = [...new Map(
            meta.versions.filter((v) => !v.includes("-") && cmp(v, latest) <= 0).sort(cmp).map((v) => [v.split(".")[0], v]),
          ).values()].reverse();
          for (const version of candidates) {
            const range = npm("view", `pnpm@${version}`, "engines.node");
            try {
              execFileSync("npx", ["-y", "semver@7", "-r", range, nodeVersion], {stdio: "ignore"});
            } catch {
              console.error(`pnpm@${version} needs Node ${range}; runner has ${nodeVersion}`);
              continue;
            }
            console.log(version);
            process.exit(0);
          }
          throw new Error(`No stable pnpm release supports Node ${nodeVersion}`);
          NODE
          )"
          echo "Using pnpm@$version on Node $(node -v)"
          corepack enable
          corepack prepare "pnpm@$version" --activate
      - name: Resolve stable package tags
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from "node:child_process";
          for (const name of ["create-next-app", "@heroui/react", "@heroui/styles"]) {
            const version = execFileSync("npm", ["view", name, "dist-tags.latest"], {encoding: "utf8"}).trim();
            if (version.includes("-")) throw new Error(`${name}@latest is prerelease: ${version}`);
            console.log(`${name}=${version}`);
          }
          NODE
      - name: Build clean fast Web baseline
        run: |
          cna="$(npm view create-next-app dist-tags.latest)"
          heroui_react="$(npm view @heroui/react dist-tags.latest)"
          heroui_styles="$(npm view @heroui/styles dist-tags.latest)"
          pnpm dlx "create-next-app@$cna" app --ts --tailwind --eslint --app --src-dir --import-alias '@/*' --use-pnpm --yes
          cd app
          pnpm add "@heroui/react@$heroui_react" "@heroui/styles@$heroui_styles"
          pnpm add -D vitest
          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync, mkdirSync} from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          pkg.scripts = {...pkg.scripts, lint: "eslint .", "lint:fix": "eslint . --fix", typecheck: "tsc --noEmit", test: "vitest run"};
          writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
          mkdirSync("src/__tests__", {recursive: true});
          writeFileSync("src/__tests__/baseline.test.ts", 'import {expect, test} from "vitest";\ntest("baseline", () => expect(true).toBe(true));\n');
          NODE
          pnpm install --lockfile-only
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
